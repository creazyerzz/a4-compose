<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="a4-compose — Arrange any images on an A4 canvas and export PDF locally in the browser."
    />
    <title>a4-compose</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <h1>a4-compose</h1>
      <p>任意图片 · A4 画布排版 · 智能裁切 · 导出 PDF</p>
        </div>
        <div class="header-actions">
          <button type="button" id="btnReset" class="btn ghost">重置</button>
          <button type="button" id="btnExport" class="btn primary">导出 PDF</button>
        </div>
      </header>

      <aside class="sidebar">
        <section class="panel">
          <h2>添加图片</h2>
          <label class="upload upload-multi">
            <span>选择或拖入图片</span>
            <input type="file" id="fileImages" accept="image/*" multiple />
            <em>支持一次添加多张</em>
          </label>
          <ul class="layer-list" id="layerList"></ul>
          <div class="btn-row">
            <button type="button" id="btnDelete" class="btn" disabled>删除选中</button>
            <button type="button" id="btnDuplicate" class="btn" disabled>复制</button>
          </div>
        </section>

        <section class="panel">
          <h2>图像处理</h2>
          <button type="button" id="btnRemoveBg" class="btn primary block" disabled>
            智能裁切证件
          </button>
          <button type="button" id="btnUndoBg" class="btn block" disabled>
            撤销裁切
          </button>
          <p class="hint">
            类似扫描王：识别证件四角 → 透视拉正 → 裁成整齐矩形（不啃坏内部图案）
          </p>
          <label class="toggle">
            <input type="checkbox" id="optDocMode" />
            <span>证件 / 文档模式</span>
          </label>
          <p class="hint">去阴影、压白底；建议去背景后开启</p>
          <label class="toggle">
            <input type="checkbox" id="optEnhance" />
            <span>清晰度增强</span>
          </label>
          <p class="hint">锐化 + 中对比度，让文字更清楚</p>
          <label class="slider">
            <span>处理强度 <b id="strengthVal">70</b>%</span>
            <input type="range" id="optStrength" min="0" max="100" value="70" />
          </label>
        </section>

        <section class="panel">
          <h2>画布操作</h2>
          <p class="hint">拖动移动；滚轮缩放；Shift+滚轮旋转</p>
          <div class="btn-row">
            <button type="button" id="btnRotateL" class="btn" disabled>旋转 -90°</button>
            <button type="button" id="btnRotateR" class="btn" disabled>旋转 +90°</button>
          </div>
          <label class="slider">
            <span>自由旋转 <b id="rotVal">0</b>°</span>
            <input type="range" id="optRotation" min="0" max="359" value="0" disabled />
          </label>
          <div class="btn-row" style="margin-top: 8px">
            <button type="button" id="btnFit" class="btn">自动排版</button>
            <button type="button" id="btnCenter" class="btn">水平居中</button>
          </div>
          <div class="btn-row" style="margin-top: 8px">
            <button type="button" id="btnBringFront" class="btn" disabled>图层置顶</button>
            <button type="button" id="btnSendBack" class="btn" disabled>图层置底</button>
          </div>
          <p class="hint">置顶/置底只改叠放顺序（重叠时才明显），左侧列表会同步</p>
          <label class="slider">
            <span>导出清晰度</span>
            <select id="optDpi">
              <option value="150">150 DPI（较快）</option>
              <option value="200" selected>200 DPI（推荐）</option>
              <option value="300">300 DPI（高清）</option>
            </select>
          </label>
        </section>

        <section class="panel privacy">
          <p>纯前端本地处理：图片不会上传到任何服务器。</p>
        </section>
      </aside>

      <main class="stage-wrap">
        <div class="stage-toolbar">
          <span id="selectionLabel">未选中</span>
          <span class="sep"></span>
          <span>A4 · 210×297 mm</span>
          <span class="sep"></span>
          <span id="itemCount">0 张图片</span>
        </div>
        <div class="stage-scroll" id="stageScroll">
          <canvas id="stage" width="794" height="1123" aria-label="A4 canvas"></canvas>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
