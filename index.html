<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="身份证 A4 正反面排版：按边缘裁切，导出 PDF。" />
    <title>身份证 A4 复印</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <h1>身份证 A4</h1>
          <p>上传正反面 → 自动扫描裁切增强 → 导出 PDF</p>
        </div>
        <div class="header-actions">
          <button type="button" id="btnReset" class="btn ghost">重置</button>
          <button type="button" id="btnExport" class="btn primary">导出 PDF</button>
        </div>
      </header>

      <aside class="sidebar">
        <section class="panel">
          <h2>上传身份证</h2>
          <label class="upload upload-multi">
            <span>选择正面、反面图片</span>
            <input type="file" id="fileImages" accept="image/*" multiple />
            <em>可一次选两张，或分两次添加</em>
          </label>
          <ul class="layer-list" id="layerList"></ul>
          <div class="btn-row">
            <button type="button" id="btnDelete" class="btn" disabled>删除选中</button>
            <button type="button" id="btnUndoBg" class="btn" disabled>撤销裁切</button>
          </div>
        </section>

        <section class="panel">
          <h2>裁切排版</h2>
          <button type="button" id="btnRemoveBg" class="btn primary block" disabled>
            裁切选中到槽位
          </button>
          <button type="button" id="btnCropAll" class="btn block">
            一键扫描裁切并排版
          </button>
          <p class="hint">
            上传后自动按边缘裁切、拉平透视、扫描增强（提亮去阴影+锐化），填入正反面
          </p>
          <button type="button" id="btnFit" class="btn block" style="margin-top: 8px">
            重新填入正反面
          </button>
        </section>

        <section class="panel">
          <h2>导出</h2>
          <label class="slider">
            <span>清晰度</span>
            <select id="optDpi">
              <option value="150">150 DPI</option>
              <option value="200">200 DPI</option>
              <option value="300" selected>300 DPI（更清晰）</option>
            </select>
          </label>
        </section>

        <section class="panel privacy">
          <p>纯本地处理，图片不会上传服务器。</p>
        </section>
      </aside>

      <main class="stage-wrap">
        <div class="stage-toolbar">
          <span id="selectionLabel">未选中</span>
          <span class="sep"></span>
          <span>身份证复印 · A4 · 210×297 mm</span>
          <span class="sep"></span>
          <span id="itemCount">0 张图片</span>
        </div>
        <div class="stage-scroll" id="stageScroll">
          <canvas id="stage" width="1191" height="1685" aria-label="身份证 A4 画布"></canvas>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
