<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>a4-compose bg-remove selftest</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, monospace;
        padding: 16px;
        background: #111;
        color: #eee;
      }
      .ok {
        color: #4ade80;
      }
      .fail {
        color: #f87171;
      }
      canvas {
        background: #fff;
        margin: 8px 8px 8px 0;
        max-width: 280px;
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <h1>bg-remove selftest</h1>
    <pre id="log"></pre>
    <div id="shots"></div>
    <script type="module">
      import { removeBackground } from "../js/enhance.js";

      const logEl = document.getElementById("log");
      const shots = document.getElementById("shots");
      const lines = [];
      function log(msg) {
        lines.push(msg);
        logEl.textContent = lines.join("\n");
      }

      /** Beige card on wood — the real failure case */
      function makeBeigeOnWood() {
        const c = document.createElement("canvas");
        c.width = 360;
        c.height = 260;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#c49648";
        ctx.fillRect(0, 0, 360, 260);
        ctx.fillStyle = "#d2c3a0";
        ctx.fillRect(65, 52, 230, 156);
        // light bands similar to wood (great-wall-like)
        ctx.fillStyle = "#c8af82";
        for (let y = 72; y < 190; y += 17) {
          ctx.fillRect(80, y, 150, 4);
        }
        ctx.fillStyle = "#286e46";
        ctx.fillRect(250, 80, 35, 45);
        ctx.fillStyle = "#222";
        ctx.font = "16px sans-serif";
        ctx.fillText("居民身份证", 90, 100);
        ctx.fillText("SAMPLE", 90, 180);
        return c;
      }

      function sampleInteriorNonWhite(canvas, margin = 0.2) {
        const { width: w, height: h } = canvas;
        const { data } = canvas.getContext("2d").getImageData(0, 0, w, h);
        const x0 = (w * margin) | 0;
        const y0 = (h * margin) | 0;
        const x1 = (w * (1 - margin)) | 0;
        const y1 = (h * (1 - margin)) | 0;
        let content = 0;
        let total = 0;
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) {
            total++;
            const i = (y * w + x) * 4;
            if (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245) content++;
          }
        }
        return content / total;
      }

      function show(label, canvas) {
        const wrap = document.createElement("div");
        wrap.innerHTML = `<div>${label} ${canvas.width}×${canvas.height}</div>`;
        wrap.appendChild(canvas);
        shots.appendChild(wrap);
      }

      let failed = 0;
      try {
        const src = makeBeigeOnWood();
        show("input", src);
        const out = removeBackground(src, { bakeCleanup: false });
        show("output", out);
        const interior = sampleInteriorNonWhite(out, 0.15);
        log(`beige-on-wood => ${out.width}x${out.height} interiorKept=${(interior * 100).toFixed(1)}%`);
        if (interior < 0.85 || out.width < 80 || out.height < 60) {
          log("FAIL: subject damaged or missing");
          failed++;
          logEl.className = "fail";
        } else {
          log("PASS: interior preserved (crop + shallow edge wipe)");
          logEl.className = "ok";
        }
      } catch (e) {
        log("FAIL: " + e.message);
        logEl.className = "fail";
        failed++;
      }

      document.title = failed ? "FAIL bg-remove" : "PASS bg-remove";
      log(failed ? `\n${failed} failed` : "\nAll passed");
    </script>
  </body>
</html>
