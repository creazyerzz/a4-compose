<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>a4-compose docscan selftest</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, monospace;
        padding: 16px;
        background: #111;
        color: #eee;
      }
      .ok {
        color: #4ade80;
      }
      .fail {
        color: #f87171;
      }
      canvas {
        background: #fff;
        margin: 8px 8px 8px 0;
        max-width: 320px;
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <h1>docscan selftest</h1>
    <pre id="log"></pre>
    <div id="shots"></div>
    <script type="module">
      import { removeBackground } from "../js/enhance.js";

      const logEl = document.getElementById("log");
      const shots = document.getElementById("shots");
      const lines = [];
      function log(msg) {
        lines.push(msg);
        logEl.textContent = lines.join("\n");
      }
      function show(label, canvas) {
        const wrap = document.createElement("div");
        wrap.innerHTML = `<div>${label} ${canvas.width}×${canvas.height}</div>`;
        wrap.appendChild(canvas);
        shots.appendChild(wrap);
      }

      /** Wood desk + rotated beige ID-like card with internal text/pattern */
      function makeScene() {
        const c = document.createElement("canvas");
        c.width = 480;
        c.height = 360;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#c49648";
        ctx.fillRect(0, 0, 480, 360);

        ctx.save();
        ctx.translate(240, 180);
        ctx.rotate((18 * Math.PI) / 180);
        ctx.fillStyle = "#d2c3a0";
        ctx.fillRect(-140, -85, 280, 170);
        ctx.fillStyle = "#c8af82";
        for (let y = -60; y < 60; y += 16) ctx.fillRect(-120, y, 160, 3);
        ctx.fillStyle = "#286e46";
        ctx.beginPath();
        ctx.arc(80, -20, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#222";
        ctx.font = "18px sans-serif";
        ctx.fillText("居民身份证", -110, -40);
        ctx.fillText("SAMPLE CARD", -110, 50);
        ctx.restore();
        return c;
      }

      function cornerIsNearWhite(canvas, tol = 30) {
        const { data, width: w, height: h } = canvas
          .getContext("2d")
          .getImageData(0, 0, canvas.width, canvas.height);
        const pts = [
          [2, 2],
          [w - 3, 2],
          [2, h - 3],
          [w - 3, h - 3],
        ];
        // After perspective, corners are card corners — should be card color, NOT desk.
        // Check that output is roughly rectangular (aspect) and center has content.
        return pts;
      }

      function centerContentRatio(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        const { data } = canvas.getContext("2d").getImageData(0, 0, w, h);
        const x0 = (w * 0.2) | 0;
        const y0 = (h * 0.2) | 0;
        const x1 = (w * 0.8) | 0;
        const y1 = (h * 0.8) | 0;
        let content = 0;
        let total = 0;
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) {
            total++;
            const i = (y * w + x) * 4;
            // not pure white desk wipe
            if (!(data[i] > 245 && data[i + 1] > 245 && data[i + 2] > 245)) content++;
          }
        }
        return content / total;
      }

      function hasGreenEmblem(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        const { data } = canvas.getContext("2d").getImageData(0, 0, w, h);
        let green = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 1] > data[i] + 20 && data[i + 1] > data[i + 2] + 20 && data[i + 1] > 80) {
            green++;
          }
        }
        return green > 80;
      }

      let failed = 0;
      try {
        const src = makeScene();
        show("input", src);
        const out = removeBackground(src);
        show("output", out);
        const ratio = out.width / out.height;
        const content = centerContentRatio(out);
        const green = hasGreenEmblem(out);
        const method = out.__bgMeta?.method || "?";
        log(
          `method=${method} size=${out.width}x${out.height} aspect=${ratio.toFixed(2)} centerContent=${(
            content * 100
          ).toFixed(1)}% greenKept=${green}`
        );
        // ID-like aspect ~1.58 or portrait ~0.63
        const aspectOk = (ratio > 1.2 && ratio < 2.4) || (ratio > 0.4 && ratio < 0.85);
        if (!aspectOk || content < 0.7 || !green) {
          log("FAIL: bad crop or interior damaged");
          failed++;
          logEl.className = "fail";
        } else {
          log("PASS: perspective/crop kept card interior");
          logEl.className = "ok";
        }
      } catch (e) {
        log("FAIL: " + e.message);
        logEl.className = "fail";
        failed++;
      }

      document.title = failed ? "FAIL docscan" : "PASS docscan";
      log(failed ? `\n${failed} failed` : "\nAll passed");
    </script>
  </body>
</html>
